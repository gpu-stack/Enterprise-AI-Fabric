server {
    listen 9090;
    server_name localhost;

    # Allow multi-file large batch uploads (up to 500MB)
    client_max_body_size 500M;

    # Serve React Static UI Build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Endpoints to FastAPI Server
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        client_max_body_size 500M;
    }

    # Proxy OpenAPI Documentation
    location /docs {
        proxy_pass http://127.0.0.1:9000/docs;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:9000/openapi.json;
    }
}
