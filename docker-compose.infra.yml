version: '3.8'

services:
  # --- 1. QDRANT VECTOR DATABASE ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-infra-net

  # --- 2. TEI EMBEDDING ENGINE ---
  tei_embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: enterprise_rag_tei_embedding
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - hf_cache:/data
    command: ["--model-id", "BAAI/bge-large-en-v1.5", "--port", "80", "--max-client-batch-size", "32"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - llm-infra-net

  # --- 3. TEI CROSS-ENCODER RERANKER ENGINE ---
  tei_reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: enterprise_rag_tei_reranker
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - hf_cache:/data
    command: ["--model-id", "BAAI/bge-reranker-large", "--port", "80", "--max-client-batch-size", "32"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - llm-infra-net

volumes:
  qdrant_storage:
    driver: local
  hf_cache:
    driver: local

networks:
  llm-infra-net:
    name: llm-infra-net
    external: true
